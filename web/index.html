<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="人身保險業務員資格測驗學習 APP">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="保險考照">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- RWD viewport — adapts to mobile / tablet / desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>保險考照 APP</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent white flash while Flutter loads */
    body {
      background-color: #1a1a2e;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* 使用手冊浮動按鈕 */
    #guide-fab {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.85);
      border-radius: 28px;
      padding: 9px 20px;
      font-size: 13px;
      font-family: 'Microsoft JhengHei', system-ui, sans-serif;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      transition: background 0.2s, opacity 0.3s;
      white-space: nowrap;
    }
    #guide-fab:hover { background: rgba(255,255,255,0.22); color: #fff; }
    /* Loading indicator */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 16px;
      font-family: sans-serif;
      color: #e0e0e0;
    }
    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #7986cb;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 使用手冊浮動按鈕（僅登入頁顯示） -->
  <a id="guide-fab" href="student-guide.html" target="_blank">
    📖 考生使用手冊
  </a>

  <div id="loading">
    <div class="spinner"></div>
    <span>保險考照 APP 載入中…</span>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('loading');
      if (el) el.remove();
    });

    // 使用手冊按鈕：僅在登入頁（#/lk）顯示
    function updateGuideFab() {
      const fab = document.getElementById('guide-fab');
      if (!fab) return;
      const onLoginPage = location.hash === '#/lk' || location.hash === '' || location.hash === '#/';
      fab.style.display = onLoginPage ? 'flex' : 'none';
    }
    window.addEventListener('hashchange', updateGuideFab);
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(updateGuideFab, 500);
      setInterval(updateGuideFab, 1000);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
